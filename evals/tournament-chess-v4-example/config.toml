[tournament]
game = "chess"
scheduler = "resident_v1"
num_games_per_pair = 256
batch_size = 128
dynamic_batch = true
dynamic_batch_min = 32
seed = 1
max_plies = 512
openings = "../../data/eval/eco_openings.pgn"
artifact_root = "../../artifacts/wandb"
output_root = "runs"
pairings = [
  ["candidate", "9M"],
  ["candidate", "136M"],
  ["candidate", "270M"],
  ["candidate", "stockfish16-standard-10ms"],
]

[adjudication]
enabled = false
path = "/usr/local/bin/stockfish"
time_limit = 0.01
threshold_cp = 1300
pool_size = 128
threads = 1
hash_mb = 16

[bayeselo]
binary = "../../artifacts/bayeselo/BayesElo/bayeselo"

[wandb]
enabled = false
project = "nanoAlphaZero-eval"

[[agents]]
name = "candidate"
kind = "kata"
artifact_path = "tdoubleu/nanoAlphaZero/jolly-wood-5-checkpoint:v18"
artifact_filename = "model15200.safetensors"
seed = 42

[agents.search]
mcts_variant = "opt"
mcts_num_simulations = 128
mcts_max_m = 128
mcts_num_k_actions = 128
mcts_visit_exponent = 1.0
mcts_visit_aggregator = "max"
mcts_maxvisit_init = 50.0
mcts_value_scale = 1.0
mcts_rescale_values = false
mcts_use_mixed_value = true
mcts_gumbel_scale = 0.0
mcts_use_opt_backward = true
mcts_bnk_rehydrate_fields = false
mcts_return_search_tree = false
mcts_return_summary = false
mcts_use_advantage_weights = false
mcts_advantage_scale = 1.0
mcts_use_puct_interior = false
exp_use_root_temperature = false
exp_root_temperature = 1.5
exp_use_all_temp = false
exp_all_temp = 1.0

[[agents]]
name = "9M"
kind = "searchless"
model = "9M"
checkpoint = "../../artifacts/searchless_chess/9M"
inference_batch_size = 1024
inference_sharding = "data_parallel"
repetition_check_version = "v2"

[[agents]]
name = "136M"
kind = "searchless"
model = "136M"
checkpoint = "../../artifacts/searchless_chess/136M"
inference_batch_size = 256
inference_sharding = "data_parallel"
repetition_check_version = "v2"

[[agents]]
name = "270M"
kind = "searchless"
model = "270M"
checkpoint = "../../artifacts/searchless_chess/270M"
inference_batch_size = 128
inference_sharding = "data_parallel"
repetition_check_version = "v2"

[[agents]]
name = "stockfish16-standard-10ms"
kind = "stockfish"
path = "/usr/local/bin/stockfish"
mode = "standard"
time_limit = 0.01
pool_size = 128
threads = 1
hash_mb = 16
