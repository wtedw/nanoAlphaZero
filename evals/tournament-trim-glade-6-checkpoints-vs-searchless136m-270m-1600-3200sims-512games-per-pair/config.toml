# Test-time scaling evaluation for the 10x192 Trim Glade 6 checkpoints.
# Pairings are ordered with both 1600-simulation models first, followed by both
# 3200-simulation models. Each checkpoint/search-budget condition plays both
# Searchless Chess 136M and 270M. Every pairing uses 256 openings with both
# entrant assignments: 512 games per pairing and 4,096 games total.

[tournament]
game = "chess"
scheduler = "resident_v1"
num_games_per_pair = 512
batch_size = 256
dynamic_batch = true
dynamic_batch_min = 32
seed = 1
max_plies = 512
openings = "../../data/eval/eco_openings.pgn"
output_root = "runs"
artifact_root = "../../artifacts/wandb"
pairings = [
  ["trim-glade-6-model10400-1600sims", "136M"],
  ["trim-glade-6-model10400-1600sims", "270M"],
  ["trim-glade-6-model20800-1600sims", "136M"],
  ["trim-glade-6-model20800-1600sims", "270M"],
  ["trim-glade-6-model10400-3200sims", "136M"],
  ["trim-glade-6-model10400-3200sims", "270M"],
  ["trim-glade-6-model20800-3200sims", "136M"],
  ["trim-glade-6-model20800-3200sims", "270M"],
]

# Stockfish evaluates the current position on CPU while the accelerator
# searches the next move.
[adjudication]
enabled = true
backend = "async_pool"
path = "../../artifacts/stockfish/16/stockfish"
time_limit = 0.01
threshold_cp = 1300
pool_size = 48
threads = 1
hash_mb = 16
protocol_timeout = 60.0

[bayeselo]
binary = "../../artifacts/bayeselo/BayesElo/bayeselo"

[wandb]
enabled = false
project = "nanoAlphaZero-eval"

[[agents]]
name = "trim-glade-6-model10400-1600sims"
kind = "kata"
artifact_path = "tdoubleu/chessv6/trim-glade-6-checkpoint:v12"
artifact_filename = "model10400.safetensors"
seed = 42

[agents.search]
mcts_variant = "opt"
mcts_num_simulations = 1600
mcts_max_m = 128
mcts_num_k_actions = 128
mcts_visit_exponent = 0.5
mcts_visit_aggregator = "sum"
mcts_maxvisit_init = 25.0
mcts_value_scale = 1.0
mcts_rescale_values = false
mcts_use_mixed_value = true
mcts_gumbel_scale = 0.0
mcts_use_opt_backward = false
mcts_bnk_rehydrate_fields = false
mcts_return_search_tree = false
mcts_return_summary = false
mcts_use_advantage_weights = false
mcts_advantage_scale = 1.0
mcts_use_puct_interior = false

